<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="45%" stop-color="#0e172e" />
      <stop offset="80%" stop-color="#140a2b" />
      <stop offset="100%" stop-color="#05060b" />
    </linearGradient>

    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#654FF0" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#9d4edd" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="glowCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3a7bd5" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#a18cd1" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#654FF0" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#654FF0" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00d2ff" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2238" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#121526" stop-opacity="0.8" />
    </linearGradient>

    <!-- Filter for Glows -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#00d2ff" flood-opacity="0.3"/>
    </filter>

    <!-- CSS Animation Styles -->
    <style>
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-12px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatFast {
        0% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-16px) scale(1.03); }
        100% { transform: translateY(0px) scale(1); }
      }
      @keyframes pulseGlow {
        0% { opacity: 0.35; transform: scale(0.95); }
        50% { opacity: 0.7; transform: scale(1.05); }
        100% { opacity: 0.35; transform: scale(0.95); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -100; }
      }
      @keyframes signalWave {
        0% { r: 4px; opacity: 1; }
        100% { r: 24px; opacity: 0; }
      }
      .card-1 { animation: floatSlow 7s ease-in-out infinite; }
      .card-2 { animation: floatFast 6s ease-in-out infinite 1s; }
      .pulse-circle { transform-origin: center; animation: pulseGlow 5s ease-in-out infinite; }
      .flow-line { stroke-dasharray: 8 6; animation: dashMove 4s linear infinite; }
      .signal { animation: signalWave 2.5s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Aura Gradients in the Deep Background -->
  <g opacity="0.6">
    <circle cx="180" cy="80" r="140" fill="url(#glowCyan)" filter="url(#blurFilter)" class="pulse-circle" />
    <circle cx="1020" cy="120" r="160" fill="url(#glowPurple)" filter="url(#blurFilter)" class="pulse-circle" style="animation-delay: 2.5s;" />
    <circle cx="600" cy="300" r="120" fill="url(#glowPurple)" filter="url(#blurFilter)" class="pulse-circle" style="animation-delay: 1.2s;" />
  </g>

  <!-- High-tech Grid Background Pattern -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="800" y1="0" x2="800" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
  </g>

  <!-- Connecting Dynamic Data-Flow Lines -->
  <path d="M 80 180 C 220 80, 360 260, 520 180 S 780 100, 1120 180" fill="none" stroke="#654FF0" stroke-opacity="0.25" stroke-width="2" class="flow-line" />
  <path d="M 120 280 C 300 210, 480 340, 680 260 S 940 210, 1100 280" fill="none" stroke="#00d2ff" stroke-opacity="0.2" stroke-width="2" class="flow-line" style="animation-duration: 6s; stroke-dashoffset: 50;" />

  <!-- Animated Floating Accent Card: Left (WebGPU / Graphics Pipeline) -->
  <g class="card-1" opacity="0.85">
    <rect x="50" y="55" width="190" height="70" rx="10" fill="url(#cardGrad)" stroke="#654FF0" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="75" cy="90" r="12" fill="#654FF0" fill-opacity="0.3" />
    <text x="75" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#00f2fe" text-anchor="middle">GS</text>
    <text x="98" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">WebGPU GS Pipeline</text>
    <text x="98" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8892b0">48 GB/s VRAM Shader</text>
    <circle cx="218" cy="72" r="3" fill="#00f2fe" />
    <circle cx="218" cy="72" r="6" fill="none" stroke="#00f2fe" class="signal" />
  </g>

  <!-- Animated Floating Accent Card: Right (Static Recompiler Binary Lifter) -->
  <g class="card-2" opacity="0.85">
    <rect x="960" y="60" width="190" height="70" rx="10" fill="url(#cardGrad)" stroke="#00d2ff" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="985" cy="95" r="12" fill="#00d2ff" fill-opacity="0.25" />
    <text x="985" y="99" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#654FF0" text-anchor="middle">EE</text>
    <text x="1008" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">MIPS R5900 AOT</text>
    <text x="1008" y="107" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#8892b0">Binary-to-Wasm Lifter</text>
    <circle cx="1128" cy="77" r="3" fill="#654FF0" />
    <circle cx="1128" cy="77" r="6" fill="none" stroke="#654FF0" class="signal" />
  </g>

  <!-- FOREGROUND CONTENT: Header Titles and Badges (Crisp, High Contrast, Guaranteed Foreground) -->
  <g text-anchor="middle">
    <!-- Top Super-Category Tag -->
    <g filter="url(#badgeGlow)">
      <rect x="440" y="38" width="320" height="28" rx="14" fill="#0c1122" stroke="#4facfe" stroke-opacity="0.6" stroke-width="1" />
      <circle cx="458" cy="52" r="4" fill="#00f2fe" />
      <text x="600" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="bold" fill="#00f2fe" letter-spacing="2">NEXT-GEN RETRO RUNTIME</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="900" fill="url(#textGrad)" letter-spacing="1">
      WebAssembly PS2 Emulation
    </text>

    <!-- Subtitle -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#e2e8f0" letter-spacing="0.5">
      &amp; Ahead-of-Time Static Recompilation Ecosystem
    </text>

    <!-- Detailed Tech Pitch -->
    <text x="600" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
      Emotion Engine (R5900) Machine Code Translation • WebGPU GS Renderers • Browser Wasm &amp; Native 6th-Gen Ports
    </text>

    <!-- Bottom Feature Pills Bar -->
    <g transform="translate(180, 240)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="185" height="38" rx="8" fill="url(#pillGrad1)" stroke="#654FF0" stroke-opacity="0.4" stroke-width="1" />
        <text x="92" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c4b5fd">⚡ Zero-JIT Stutter AOT</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(215, 0)">
        <rect x="0" y="0" width="195" height="38" rx="8" fill="url(#pillGrad2)" stroke="#00d2ff" stroke-opacity="0.4" stroke-width="1" />
        <text x="97" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">🌐 Client-Side Browser Wasm</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(440, 0)">
        <rect x="0" y="0" width="190" height="38" rx="8" fill="url(#pillGrad1)" stroke="#654FF0" stroke-opacity="0.4" stroke-width="1" />
        <text x="95" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#c4b5fd">🎮 WebGPU Rasterizer</text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(660, 0)">
        <rect x="0" y="0" width="180" height="38" rx="8" fill="url(#pillGrad2)" stroke="#00d2ff" stroke-opacity="0.4" stroke-width="1" />
        <text x="90" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#7dd3fc">☁️ Cloud Game SaaS</text>
      </g>
    </g>

    <!-- Bottom Mini Status Line -->
    <text x="600" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#64748b" letter-spacing="1">
      CURATED OPEN-SOURCE REPOSITORIES &amp; CLOUD GAMING PLATFORMS • 2026 EDITION
    </text>
  </g>
</svg>